<!-- ============================================================
     Wix-ready, self-contained, no network needed.
     Global header logo: a cloud of particles sweeps in from across the header and forms the Tactien
     lockup (icon, THE TACTIEN GROUP, tagline) at the top left, a scan line crosses it, and it settles into
     the static logo. About 3 seconds, plays once, then stops drawing (no idle cost).
     Transparent background, so it sits on any header color.

     BEST: size the embed to the whole header strip (full page width, header height), layered behind the menu.
     The particles travel across that strip, so a wider strip gives a bigger sweep. The lockup is drawn at its
     real size, so one URL works on desktop and phone with no settings:
       strip (embed at least lockup + 92 px wide):
         desktop:  lockup 508 x 139, 46 px from the left, centered top to bottom
         phone:    lockup 256 x 82 (two line tagline, used when the embed is under 400 px wide), 26 px from the left, 6 px from the top
       logo sized embed (smaller than that): the lockup fills the embed, shrinking to fit, centered. The sweep is smaller.
     To nudge the position, add ?x=64&y=40 (px from the top left of the embed) to the URL.
     Only the lockup is a link (to the home page). The rest of the strip does nothing.
     Hover (or keyboard focus) on the lockup adds a faint warm halo and a soft light that follows the pointer.

     Plays on the first page of a visit, then shows the finished logo straight away on later pages.
     URL options:  ?always=1  play every time    ?t=1.2  hold the frame at 1.2 s    ?bg=F0F0F0  paint a background (review only)
     Reduced motion: shows the finished logo with no animation.

     Source: docs/ttg-website-animation/src/logo.template.html (lockup image from src/prep-lockup.mjs).

    ctx.globalAlpha = 1;
    if (hv > 0.002) {                                                      // soft light that follows the pointer, only lands on the logo
      const r = Math.max(box.w, box.h) * 0.34, g = ctx.createRadialGradient(hov.sx, hov.sy, 0, hov.sx, hov.sy, r);
      g.addColorStop(0, `rgba(255,236,205,${0.3 * hv})`); g.addColorStop(0.55, `rgba(255,226,180,${0.12 * hv})`); g.addColorStop(1, 'rgba(255,226,180,0)');
      ctx.save(); ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = g; ctx.fillRect(box.x - 20, box.y - 20, box.w + 40, box.h + 40);
      ctx.restore();
    }
  }
  // scan line across the lockup as it resolves, left to right
  if (!still) {
    const sc = (t - T.scan[0]) / (T.scan[1] - T.scan[0]);
    if (sc > 0 && sc < 1) {
      const sx = box.x + box.w * easeInOutCubic(sc), bw = Math.max(16, box.w * 0.04);
      const g = ctx.createLinearGradient(sx - bw, 0, sx + bw, 0);
      g.addColorStop(0, 'rgba(200,151,90,0)'); g.addColorStop(.5, 'rgba(200,151,90,.3)'); g.addColorStop(1, 'rgba(200,151,90,0)');
      ctx.save(); ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip();
      ctx.fillStyle = g; ctx.fillRect(sx - bw, box.y, bw * 2, box.h); ctx.restore();
    }
  }
}

// hover: runs its own short loop only while the pointer is on the logo or the light is still fading
let hraf = 0, hlast = 0;
function hoverLoop(now) {
  hraf = 0;
  const dt = Math.min(0.1, (now - hlast) / 1000); hlast = now;
  const target = hov.in ? 1 : 0, k = 1 - Math.exp(-dt * 5), kp = 1 - Math.exp(-dt * 8);
  hov.sx += (hov.x - hov.sx) * kp; hov.sy += (hov.y - hov.sy) * kp;
  hov.v += (target - hov.v) * k;
  if (Math.abs(target - hov.v) < 0.003) hov.v = target;
  render(T.end);
  if (hov.v !== target || Math.hypot(hov.x - hov.sx, hov.y - hov.sy) > 0.3) hraf = requestAnimationFrame(hoverLoop);
}
function kickHover() { if (!hraf && (window.__done || still) && holdAt === null) { hlast = performance.now(); hraf = requestAnimationFrame(hoverLoop); } }
link.addEventListener('pointerenter', (e) => { if (e.pointerType === 'touch') return; hov.in = true; hov.x = hov.sx = e.clientX; hov.y = hov.sy = e.clientY; kickHover(); });
link.addEventListener('pointermove', (e) => { if (e.pointerType === 'touch' || !hov.in) return; hov.x = e.clientX; hov.y = e.clientY; kickHover(); });
link.addEventListener('pointerleave', () => { hov.in = false; kickHover(); });
link.addEventListener('focus', () => { hov.in = true; hov.x = hov.sx = box.x + box.w / 2; hov.y = hov.sy = box.y + box.h / 2; kickHover(); });
link.addEventListener('blur', () => { hov.in = false; kickHover(); });

let t0 = 0, raf = 0;
function loop(now) {
  if (!t0) t0 = now;
  const t = (now - t0) / 1000;
  render(Math.min(t, T.end));
  if (t < T.end) raf = requestAnimationFrame(loop);
  else { try { sessionStorage.setItem('ttgLogoRevealed', '1'); } catch (e) {} window.__done = true; }
}
function start() {
  layout();
  window.__render = (x) => { render(x); };
  window.__box = () => ({ ...box, W, H, n: pts.n, variant });
  window.__hov = () => ({ in: hov.in, v: +hov.v.toFixed(3) });
  window.__ready = true;
  if (holdAt !== null) { render(holdAt); return; }
  if (still) { render(T.end); window.__done = true; return; }
  raf = requestAnimationFrame(loop);
}
addEventListener('resize', () => { if (!window.__ready) return; layout(); render(window.__done || still ? T.end : holdAt !== null ? holdAt : 0.001 + (performance.now() - t0) / 1000); });

let loaded = 0;
for (const k of ['A', 'B']) { const im = new Image(); im.onload = () => { if (++loaded === 2) start(); }; im.src = LOCKUP[k].url; imgs[k] = im; }
})();
</script>
