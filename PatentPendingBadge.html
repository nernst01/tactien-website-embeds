<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Pending Badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:"Roboto",Arial,sans-serif}
  .badge{display:inline-block;padding:7px 16px;border:1px solid #C8975A;border-radius:999px;color:#C8975A;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;white-space:nowrap}
</style>
</head>
<body>
  <div class="badge">Patent-Pending</div>
</body>
</html>
