<!--
  Tactien CAST Hero — single looping video
  Same footage as CAST's in-app hero (src/pages/cast/Home.jsx), native aspect
  ratio 1920x954. No crossfade, no overlays -- just a full-bleed loop, video
  hosted on Wix Media Manager (video.wixstatic.com), ready for the Custom
  HTML embed on the CUAS page's CAST section.
-->
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex" />
<meta name="googlebot" content="noindex, indexifembedded" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --near-black: #1A1A1A;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--near-black);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: pan-y;
  }
  /* The embed must never take a swipe from the page: on phones and tablets it ignores touch entirely. */
  @media (hover: none) and (pointer: coarse) { html, body, #stage, video { pointer-events: none; } }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--near-black);
  }
  video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

<div id="stage">
  <video
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline="true"
    referrerpolicy="unsafe-url"
    poster="https://static.wixstatic.com/media/f27dcb_42681bcab03a4467b45ebd01d17157b0f001.jpg"
  ></video>
</div>

<script>
// The embed never shows wider than about 800 px, so 1080p (16 MB) is wasted. 720p is 7.6 MB, 480p is 3.9 MB.
(function () {
  var v = document.querySelector('video');
  var q = window.innerWidth < 500 ? '480p' : '720p';
  v.src = 'https://video.wixstatic.com/video/f27dcb_42681bcab03a4467b45ebd01d17157b0/' + q + '/mp4/file.mp4';
})();
</script>

</body>
</html>
