     Wix-ready, self-contained (needs internet for the Roboto font only).
     Homepage hero animation: the Tactien climb graphic builds itself from particles in sequence
     (ground line, climb curve, each aircraft, the sensors, the detection arcs), then idles with
     radar pings while the capability list flashes in the background.

     SIZE THE EMBED to the full page width. The graphic scales to the width, so about 46 percent of
     the width is a good height (1440 x 662 on desktop, about 390 x 300 on a phone).

     EDIT THE FLASHING TEXT: change the SIGNALS array in the script below, one name per line.
     Add or remove lines freely, the layout places whatever is there.

     URL options (for review only, the embed needs none):
       ?controls=1   show the player bar
       ?t=7.5        start at 7.5 s     ?paused=1   hold the frame     ?static=1   final frame, no motion

// Place every name in two fixed slots on free background, away from the graphic and from each other.

function layoutLabels() {

      const ps = Math.max(1.0 * u, 1.25);
      ctx.fillStyle = prog(t, g.t0, g.t0 + g.dur) < 0.85 ? GOLD_HI : GOLD;
      for (let i = 0; i < g.n; i++) {
        const pi = clamp01((t - g.t0 - g.dl[i] * g.dur * 0.45) / (g.dur * 0.55));
        if (pi <= 0) continue;
        const e = easeOutCubic(pi), off = 1 - e, sw = g.sw[i] * Math.sin(pi * Math.PI) * 0.4;
        const x = g.tx[i * 2] + g.sx[i] * off - g.sy[i] * sw, y = g.tx[i * 2 + 1] + g.sy[i] * off + g.sx[i] * sw;
        ctx.globalAlpha = Math.min(1, pi * 4) * (1 - solid);
        ctx.fillRect(x - ps / 2, y - ps / 2, ps, ps);
      }
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

// ---------- frame ----------
function render(t, still) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawNetwork(t);
  drawLabels(t, still);
  drawGraphic(t);
  bctx.clearRect(0, 0, bloom.width, bloom.height);
  bctx.drawImage(main, 0, 0, bloom.width, bloom.height);
}

// ---------- player ----------
const ui = { play: document.getElementById('play'), replay: document.getElementById('replay'), scrub: document.getElementById('scrub'), clock: document.getElementById('clock'), stat: document.getElementById('stat') };
let t = Number(Q.get('t')) || 0, playing = Q.get('paused') !== '1', last = 0, staticMode = false, onScreen = true, running = false;
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
if (Q.get('controls') === '1') document.body.classList.add('controls');
if (reduced || Q.get('static') === '1') { staticMode = true; ui.stat.checked = true; playing = false; }

function frame(now) {
  running = false;
  const dt = Math.min(0.1, (now - last) / 1000);
  if (playing && !staticMode) t += dt;
  last = now;
  const tt = staticMode ? END : t;
  const busy = staticMode ? false : updateHover(dt, tt);
  render(tt, staticMode);
  ui.scrub.value = Math.min(16, tt); ui.clock.textContent = tt.toFixed(1) + 's';
  if (staticMode || (!playing && !busy)) return;           // nothing moves, so stop drawing
  if (onScreen && !document.hidden) { running = true; requestAnimationFrame(frame); }
}
function kick() { if (!running) { last = performance.now(); running = true; requestAnimationFrame(frame); } }
ui.play.onclick = () => { playing = !playing; ui.play.textContent = playing ? 'Pause' : 'Play'; kick(); };
ui.replay.onclick = () => { t = 0; playing = true; staticMode = false; ui.stat.checked = false; ui.play.textContent = 'Pause'; kick(); };
ui.scrub.oninput = () => { t = Number(ui.scrub.value); playing = false; staticMode = false; ui.stat.checked = false; ui.play.textContent = 'Play'; kick(); };
ui.stat.onchange = () => { staticMode = ui.stat.checked; ui.play.textContent = (playing && !staticMode) ? 'Pause' : 'Play'; kick(); };
addEventListener('keydown', (e) => { if (e.code === 'Space' && document.body.classList.contains('controls')) { e.preventDefault(); ui.play.click(); } });
addEventListener('resize', () => { layout(); kick(); });
document.addEventListener('visibilitychange', kick);

// pointer: mouse and pen hover the pieces, a touch tap lifts one for a moment
const toGraphic = (e) => { const r = stage.getBoundingClientRect(); return [(e.clientX - r.left - L.gx) / L.S, (e.clientY - r.top - L.gy) / L.S]; };
let tapTimer = 0;
function pointTo(e) { const [x, y] = toGraphic(e); if (!pointer.in) { pointer.sx = x; pointer.sy = y; } pointer.in = true; pointer.x = x; pointer.y = y; }
stage.addEventListener('pointermove', (e) => { if (e.pointerType === 'touch') return; pointTo(e); kick(); });
stage.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch') return;
  pointTo(e); kick(); clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { pointer.in = false; kick(); }, 1400);
});
const leave = () => { pointer.in = false; kick(); };
stage.addEventListener('pointerleave', leave);
document.documentElement.addEventListener('mouseleave', leave);
addEventListener('blur', leave);
if ('IntersectionObserver' in window) new IntersectionObserver((es) => { onScreen = es[0].isIntersecting; if (onScreen) kick(); }).observe(stage);
if (!playing) ui.play.textContent = 'Play';

layout();
window.__render = (x, s) => { render(x, !!s); };
window.__setT = (x) => { t = x; staticMode = false; playing = false; render(x, false); };
window.__labels = () => ({ names: labels.length, slots: slots.length, shown: new Set(slots.flatMap((s) => s.occ)).size, perSlot: slots.map((s) => s.occ.length), ys: slots.map((s) => Math.round(s.y)) });
window.__pieces = () => PIECES.map((p) => ({ id: p.id, cx: p.cx, cy: p.cy, hv: +p.hv.toFixed(3) }));
window.__layout = () => ({ ...L, W, H });
window.__END = END; window.__ready = true;
kick();
if (document.fonts && document.fonts.load) document.fonts.load(`500 14px Roboto`).then(() => { layout(); kick(); }).catch(() => {});
})();
</script>
</body>
</html>
